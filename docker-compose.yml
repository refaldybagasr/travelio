services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - GOOGLE_BOOKS_BASE_URL=${GOOGLE_BOOKS_BASE_URL:-}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - backend
